# ==============================================================================
# Glö Salon Platform — Production Nginx Reverse Proxy & Load Balancer Configuration
# Architecture: Optimized for 1,000+ to 10,000+ Concurrent Users
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535; # Handle high concurrent file descriptors
pid /var/run/nginx.pid;

events {
    worker_connections 8192; # Max connections per worker process
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing and upstream response time
    log_format production_json escape=json
      '{"time_local":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log production_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Basic Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Request Buffer Tuning (Prevent slowloris attacks & buffer bloat)
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # ==========================================================================
    # Gzip Compression
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================================================
    # Rate Limiting Zones (DDoS & Brute Force Prevention)
    # ==========================================================================
    # Global API Rate Limit: 100 requests/sec per IP, burst 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # Auth Endpoints Rate Limit: 5 requests/sec per IP, burst 10
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # ==========================================================================
    # Nginx Proxy Cache Zone (Edge Caching for API & Static Pages)
    # ==========================================================================
    proxy_cache_path /var/cache/nginx/glo_cache
        levels=1:2
        keys_zone=GLO_CACHE:20m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # ==========================================================================
    # Upstream Application Servers (Horizontal Load Balancing)
    # ==========================================================================
    upstream glo_backend {
        # Least connections distribution algorithm
        least_conn;

        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1;
        # Add additional Node instances / microVMs here:
        # server 10.0.0.2:5000 max_fails=3 fail_timeout=10s;
        # server 10.0.0.3:5000 max_fails=3 fail_timeout=10s;

        # Keepalive connections to upstream to minimize TCP handshake overhead
        keepalive 64;
    }

    # ==========================================================================
    # HTTP Server -> Redirect HTTP to HTTPS
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name glosalon.com www.glosalon.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Server (SSL/TLS + HTTP/2)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name glosalon.com www.glosalon.com;

        # SSL Certificates (Let's Encrypt / Cloudflare Origin Cert)
        ssl_certificate /etc/letsencrypt/live/glosalon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/glosalon.com/privkey.pem;

        # Modern SSL Configuration (A+ Rating)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ======================================================================
        # Static Assets (Images, WebP, Fonts, Icons) — 30 Days Cache
        # ======================================================================
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2|woff|ttf|eot)$ {
            root /var/www/glo-salon/frontend;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
            tcp_nodelay off;
            open_file_cache max=5000 inactive=120s;
            open_file_cache_valid 45s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
        }

        # ======================================================================
        # CSS & JavaScript Assets — 1 Day Cache + Stale-While-Revalidate
        # ======================================================================
        location ~* \.(css|js)$ {
            root /var/www/glo-salon/frontend;
            expires 1d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            access_log off;
        }

        # ======================================================================
        # Auth API Endpoints (Strict Rate Limit)
        # ======================================================================
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://glo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ======================================================================
        # Public Read-Heavy API Endpoints (Edge Caching Enabled)
        # ======================================================================
        location ~ ^/api/(services|salons) {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://glo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Nginx Edge Micro-Caching
            proxy_cache GLO_CACHE;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            add_header X-Proxy-Cache $upstream_cache_status;
        }

        # ======================================================================
        # Default Proxy Pass (All Other API Routes & Dynamic Requests)
        # ======================================================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://glo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ======================================================================
        # Health Check Route for Load Balancers & Monitors (No Rate Limit)
        # ======================================================================
        location /api/health {
            proxy_pass http://glo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # ======================================================================
        # Frontend Single Page App / HTML Pages
        # ======================================================================
        location / {
            root /var/www/glo-salon/frontend;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }
}
