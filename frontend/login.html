<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Glö Salon</title>
  <meta name="description" content="Login or register with your phone number to manage bookings on Glö Salon.">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-page">
  <!-- Background blobs -->
  <div class="parallax-layer parallax-layer-1" style="position:fixed;"></div>
  <div class="parallax-layer parallax-layer-2" style="position:fixed;"></div>

  <div style="position:relative;z-index:10;width:100%;max-width:440px;">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:2rem;">
      <a href="index.html" class="nav-logo" style="justify-content:center;display:inline-flex;">
        <div class="nav-logo-icon" style="width:52px;height:52px;font-size:1.4rem;">G</div>
        <div>
          <div class="nav-logo-text" style="font-size:1.8rem;"><span>Gl</span><span>ö</span></div>
          <span class="nav-logo-sub">Premium Salon</span>
        </div>
      </a>
    </div>

    <!-- Phone Step -->
    <div class="glass-card auth-card" id="phone-card">
      <h1>Welcome Back 👋</h1>
      <p class="sub">Enter your phone number to login or create an account.</p>

      <div class="form-group">
        <label>Your Name (optional for new users)</label>
        <input type="text" id="input-name" placeholder="e.g. Priya Sharma" autocomplete="name">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="input-phone" placeholder="+91 98765 43210" autocomplete="tel" required>
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="sendOtp()" id="send-otp-btn">
        Send OTP →
      </button>

      <p style="font-size:0.8rem;color:var(--text-70);text-align:center;margin-top:1.25rem;">
        By continuing, you agree to our <a href="#" style="color:var(--primary);">Terms of Service</a> &amp; <a href="#" style="color:var(--primary);">Privacy Policy</a>.
      </p>
    </div>

    <!-- OTP Step -->
    <div class="glass-card auth-card hidden" id="otp-card">
      <h1>Enter OTP 🔐</h1>
      <p class="sub" id="otp-sent-msg">We've sent a 6-digit OTP to your number.</p>

      <div class="otp-inputs" id="otp-inputs">
        <input class="otp-input" type="text" maxlength="1" id="otp-0" oninput="otpNext(this,0)">
        <input class="otp-input" type="text" maxlength="1" id="otp-1" oninput="otpNext(this,1)">
        <input class="otp-input" type="text" maxlength="1" id="otp-2" oninput="otpNext(this,2)">
        <input class="otp-input" type="text" maxlength="1" id="otp-3" oninput="otpNext(this,3)">
        <input class="otp-input" type="text" maxlength="1" id="otp-4" oninput="otpNext(this,4)">
        <input class="otp-input" type="text" maxlength="1" id="otp-5" oninput="otpNext(this,5)">
      </div>

      <!-- Dev hint -->
      <div id="dev-otp-hint" class="hidden" style="padding:0.75rem;border-radius:10px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);font-size:0.82rem;text-align:center;margin-bottom:1rem;color:#166534;">
        🛠 Dev OTP: <strong id="dev-otp-value"></strong> (check server console too)
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="verifyOtp()" id="verify-otp-btn">
        Verify & Login →
      </button>

      <div style="text-align:center;margin-top:1rem;">
        <button onclick="backToPhone()" style="background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;font-size:0.875rem;">
          ← Change phone number
        </button>
      </div>
    </div>

    <!-- Back to Home -->
    <div style="text-align:center;margin-top:1.5rem;">
      <a href="index.html" style="color:var(--primary);font-weight:600;font-size:0.875rem;">← Back to Home</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  let userPhone = '';

  // If already logged in, redirect
  if (isLoggedIn()) {
    const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
    window.location.href = redirect;
  }

  async function sendOtp() {
    const phone = document.getElementById('input-phone').value.trim();
    const name  = document.getElementById('input-name').value.trim();
    if (!phone) { showToast('Please enter your phone number', 'error'); return; }

    const btn = document.getElementById('send-otp-btn');
    btn.disabled = true; btn.textContent = 'Sending…';

    try {
      const res = await AuthAPI.sendOtp(phone, name);
      userPhone = phone;

      // Show dev OTP hint
      if (res.devOtp) {
        document.getElementById('dev-otp-hint').classList.remove('hidden');
        document.getElementById('dev-otp-value').textContent = res.devOtp;
        // Auto-fill OTP inputs for convenience in dev
        res.devOtp.split('').forEach((d, i) => {
          const el = document.getElementById(`otp-${i}`);
          if (el) el.value = d;
        });
      }

      document.getElementById('otp-sent-msg').textContent =
        `OTP sent to ${phone}. Check the server console for the code.`;
      document.getElementById('phone-card').classList.add('hidden');
      document.getElementById('otp-card').classList.remove('hidden');
      document.getElementById('otp-0').focus();
      showToast(res.message, 'success');
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Send OTP →';
    }
  }

  function otpNext(el, idx) {
    el.value = el.value.replace(/\D/, '');
    if (el.value && idx < 5) {
      document.getElementById(`otp-${idx + 1}`).focus();
    }
    if (idx === 5 && el.value) verifyOtp();
  }

  async function verifyOtp() {
    const otp = Array.from({ length: 6 }, (_, i) => document.getElementById(`otp-${i}`).value).join('');
    if (otp.length < 6) { showToast('Enter the full 6-digit OTP', 'error'); return; }

    const btn = document.getElementById('verify-otp-btn');
    btn.disabled = true; btn.textContent = 'Verifying…';

    try {
      const res = await AuthAPI.verifyOtp(userPhone, otp);
      setToken(res.token);
      setUser(res.user);
      showToast(`Welcome, ${res.user.name || 'User'}! 🎉`, 'success');

      // Role-based routing
      const urlRedirect = new URLSearchParams(window.location.search).get('redirect');
      let redirect = urlRedirect;
      if (!redirect || redirect === 'login.html') {
        redirect = (res.user && res.user.role === 'salon_owner') ? 'salon-profile.html' : 'index.html';
      } else if (redirect === 'profile.html' && res.user && res.user.role === 'salon_owner') {
        redirect = 'salon-profile.html';
      } else if (redirect === 'salon-profile.html' && res.user && res.user.role === 'client') {
        redirect = 'profile.html';
      }

      setTimeout(() => window.location.href = redirect, 1200);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Verify & Login →';
    }
  }

  function backToPhone() {
    document.getElementById('otp-card').classList.add('hidden');
    document.getElementById('phone-card').classList.remove('hidden');
    document.getElementById('send-otp-btn').disabled = false;
    document.getElementById('send-otp-btn').textContent = 'Send OTP →';
  }

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (!document.getElementById('phone-card').classList.contains('hidden')) sendOtp();
      else verifyOtp();
    }
  });
</script>
</body>
</html>
