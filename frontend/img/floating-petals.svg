<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rosePetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8E8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F9A8D4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="lavenderPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.75" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#831843" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Main Petal (Upper left) -->
    <path d="M 180 160 C 240 100, 320 120, 310 210 C 300 300, 190 280, 160 230 C 130 180, 150 170, 180 160 Z" fill="url(#rosePetal1)" transform="rotate(-15 235 190)" />

    <!-- Secondary Petal (Center right) -->
    <path d="M 380 280 C 440 230, 500 260, 480 340 C 460 410, 380 390, 350 350 C 320 310, 350 290, 380 280 Z" fill="url(#lavenderPetal)" transform="rotate(25 415 320)" />

    <!-- Foreground accent petal -->
    <path d="M 220 380 C 270 330, 320 360, 300 420 C 280 480, 210 460, 190 430 C 170 400, 190 390, 220 380 Z" fill="url(#rosePetal1)" transform="rotate(-30 250 410)" opacity="0.85" />
  </g>
</svg>
