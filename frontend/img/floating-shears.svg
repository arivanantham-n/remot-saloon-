<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShears" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="bladeChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <filter id="shearsShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shearsShadow)" transform="rotate(-15 300 300)">
    <!-- Scissor Blade 1 -->
    <path d="M 160 480 C 120 480 90 430 110 390 C 130 350 180 370 200 410 C 210 430 200 480 160 480 Z" fill="none" stroke="url(#goldShears)" stroke-width="18" />
    <path d="M 180 400 L 290 290 L 460 120 C 470 110 460 100 450 110 L 280 270 Z" fill="url(#bladeChrome)" />
    <!-- Blade cutting edge highlight -->
    <line x1="285" y1="275" x2="455" y2="105" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Scissor Blade 2 (Crossed) -->
    <path d="M 400 480 C 440 480 470 430 450 390 C 430 350 380 370 360 410 C 350 430 360 480 400 480 Z" fill="none" stroke="url(#goldShears)" stroke-width="18" />
    <path d="M 380 400 L 270 290 L 100 120 C 90 110 100 100 110 110 L 280 270 Z" fill="url(#bladeChrome)" />
    <!-- Blade cutting edge highlight -->
    <line x1="275" y1="275" x2="105" y2="105" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Pivot Screw & Jewel -->
    <circle cx="280" cy="285" r="18" fill="url(#goldShears)" stroke="#78350F" stroke-width="2" />
    <circle cx="280" cy="285" r="10" fill="#6C3CE9" />
    <circle cx="277" cy="282" r="3" fill="#FFFFFF" />
  </g>
</svg>
