<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Radial Glow Gradients -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="1" />
      <stop offset="25%" stop-color="#F4B942" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#F4B942" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#6C3CE9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6C3CE9" stop-opacity="0" />
    </radialGradient>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Atmospheric bokeh bubbles -->
  <circle cx="280" cy="220" r="45" fill="url(#goldGlow)" filter="url(#blurSoft)" />
  <circle cx="560" cy="340" r="70" fill="url(#purpleGlow)" filter="url(#blurSoft)" />
  <circle cx="220" cy="520" r="35" fill="url(#goldGlow)" filter="url(#blurSoft)" />
  <circle cx="640" cy="580" r="55" fill="url(#purpleGlow)" filter="url(#blurSoft)" />

  <!-- Primary 4-point sparkle star (Gold) -->
  <g transform="translate(420, 240)">
    <circle cx="0" cy="0" r="45" fill="url(#goldGlow)" />
    <!-- Vertical blade -->
    <path d="M0,-85 C1,-25 4,-6 35,-1 C4,4 1,25 0,85 C-1,25 -4,4 -35,-1 C-4,-6 -1,-25 0,-85 Z" fill="#FCE794" />
    <!-- Horizontal blade -->
    <path d="M-85,0 C-25,-1 -6,-4 -1,-35 C4,-4 25,-1 85,0 C25,1 4,4 -1,35 C-6,4 -25,1 -85,0 Z" fill="#FFF8E0" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Secondary sparkle star (Violet) -->
  <g transform="translate(230, 440)">
    <circle cx="0" cy="0" r="35" fill="url(#purpleGlow)" />
    <path d="M0,-60 C1,-18 3,-4 25,-1 C3,3 1,18 0,60 C-1,18 -3,3 -25,-1 C-3,-4 -1,-18 0,-60 Z" fill="#C4B5FD" />
    <path d="M-60,0 C-18,-1 -4,-3 -1,-25 C3,-3 18,-1 60,0 C18,1 3,3 -1,25 C-4,3 -18,1 -60,0 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- Third sparkle star (Champagne) -->
  <g transform="translate(620, 380)">
    <circle cx="0" cy="0" r="40" fill="url(#goldGlow)" />
    <path d="M0,-70 C1,-20 3,-5 30,-1 C3,3 1,20 0,70 C-1,20 -3,3 -30,-1 C-3,-5 -1,-20 0,-70 Z" fill="#FDE68A" />
    <path d="M-70,0 C-20,-1 -5,-3 -1,-30 C3,-3 20,-1 70,0 C20,1 3,3 -1,30 C-5,3 -20,1 -70,0 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Small accent glitters -->
  <circle cx="360" cy="380" r="4" fill="#FFFFFF" />
  <circle cx="480" cy="180" r="3" fill="#F4B942" />
  <circle cx="180" cy="320" r="3.5" fill="#A78BFA" />
  <circle cx="510" cy="490" r="4.5" fill="#FFFFFF" />
  <circle cx="680" cy="220" r="3" fill="#FDE68A" />
</svg>
